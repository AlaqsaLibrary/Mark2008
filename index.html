<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>مكتبة الأقصى - معدل 2008</title>
    <link rel="stylesheet" href="css/form.css" />
  </head>
  <body>
    <header>مكتبة الأقصى - معدل 2008</header>
    <div class="container">
      <main role="main" class="pb-3">
        <div class="calculator">
          <h1>حساب معدل جيل 2008</h1>

          <div id="form-container">
            <div class="row">
              <label>المعدل القديم</label>
              <input type="number" id="old" placeholder="المعدل القديم" />
            </div>

            <div class="row">
              <label>المادة الأولى</label>
              <input type="number" id="nu1" placeholder="العلامة" />
            </div>

            <div class="row">
              <label>المادة الثانية</label>
              <input type="number" id="nu2" placeholder="العلامة" />
            </div>

            <div class="row">
              <label>المادة الثالثة</label>
              <input type="number" id="nu3" placeholder="العلامة" />
            </div>

            <div class="row">
              <label>المادة الرابعة</label>
              <input type="number" id="nu4" placeholder="العلامة" />
            </div>

            <button id="calcBtn" type="button">احسب المعدل</button>
          </div>
        </div>

        <!-- خلفية النافذة -->
        <div id="overlay"></div>

        <!-- نافذة النتيجة -->

        <div id="resultBox">
          <button
            class="closeResult"
            onclick="closeResult()"
            type="button"
          ></button>

          <h2>نتيجة الاحتساب</h2>

          <p>
            المعدل القديم (30%) :
            <span id="oldResult"></span>
          </p>

          <p>
            المادة الأولى (17.5%) :
            <span id="r1"></span>
          </p>

          <p>
            المادة الثانية (17.5%) :
            <span id="r2"></span>
          </p>

          <p>
            المادة الثالثة (17.5%) :
            <span id="r3"></span>
          </p>

          <p>
            المادة الرابعة (17.5%) :
            <span id="r4"></span>
          </p>

          <hr />

          <h3>
            المعدل النهائي :
            <span id="finalResult"></span>
          </h3>
        </div>
      </main>
    </div>

    <footer class="border-top footer text-muted">
      <div class="footer-container">
        &copy;
        <div>
          Developed by
          <a
            href="https://salahghanem.github.io/portfolio/html/arabic.html"
            target="_blank"
          >
            Salah Ghanem
          </a>
        </div>

        2026 - mark2008
      </div>
    </footer>

    <script src="/js/script.js"></script>
  </body>
</html>
